Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 25M
MaxRecursion 8
MaxFiles 100
MaxThreads 4
MaxQueue 8
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
ScanPDF yes
ScanArchive yes
ConcurrentDatabaseReload no
ReadTimeout 15
CommandReadTimeout 5
SelfCheck 600
