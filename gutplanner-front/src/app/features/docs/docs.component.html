<app-nar-bar />
<main id="docs-page" class="min-h-screen bg-gray-50 px-4 pb-10 pt-28 text-gray-900 dark:bg-gray-950 dark:text-white sm:px-8">
  <section class="mx-auto max-w-7xl">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <div><p class="text-sm font-semibold text-cyan-600 dark:text-cyan-400">GutPlanner API</p><h1 class="mt-1 text-3xl font-bold">Documentação</h1><p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Explore os endpoints, parâmetros e modelos da API.</p></div>
      <a id="docs-json" [href]="schemaUrl" target="_blank" rel="noopener noreferrer" class="rounded-xl border border-cyan-500/30 px-4 py-2 text-sm font-semibold text-cyan-700 hover:bg-cyan-500/10 dark:text-cyan-400">Abrir JSON ↗</a>
    </div>
    @if (loading()) { <p id="docs-loading" role="status" class="mb-4 text-sm text-gray-500">Carregando contratos…</p> }
    @if (error()) {
      <div id="docs-error" role="alert" class="mb-4 rounded-2xl border border-amber-500/30 bg-amber-50 p-5 text-sm text-amber-900 dark:bg-amber-950/30 dark:text-amber-200">
        <p>Não foi possível carregar a documentação. Verifique se a API está disponível.</p>
        <button id="docs-retry" name="docsRetry" type="button" (click)="load()" class="mt-3 cursor-pointer font-semibold underline">Tentar novamente</button>
      </div>
    }
    <div class="overflow-x-auto rounded-2xl border border-gray-200 bg-white p-3 shadow-sm sm:p-6 dark:border-cyan-500/30"><div #swagger id="docs-swagger"></div></div>
  </section>
</main>
