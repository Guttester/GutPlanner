<app-nar-bar />
<section id="inicio" aria-labelledby="login-title" class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gray-50 px-4 pt-32 pb-16 font-sans transition-colors duration-500 dark:bg-gray-950">
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 size-96 rounded-full bg-cyan-400/20 blur-3xl dark:bg-cyan-500/10"></div>
    <div class="absolute top-1/2 -left-40 size-80 rounded-full bg-violet-500/10 blur-3xl dark:bg-violet-600/10"></div>
  </div>

  <div class="relative w-full max-w-sm rounded-2xl border border-gray-200 bg-white px-5 pt-10 pb-5 shadow-xl shadow-slate-900/5 sm:px-7 sm:pb-7 dark:border-cyan-500/30 dark:bg-gray-900/80">
    <div aria-hidden="true" class="absolute top-0 left-1/2 flex size-14 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-4 border-white bg-cyan-50 shadow-md dark:border-gray-900 dark:bg-cyan-950">
      <svg class="size-6 text-cyan-600 dark:text-cyan-400" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
    </div>

    <div class="mb-8 text-center">
      <h1 id="login-title" class="text-2xl font-bold text-gray-900 dark:text-white">Seja bem-vindo!</h1>
      <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Entre na sua conta do GutPlanner.</p>
    </div>

    <form id="login-form" name="loginForm" [formGroup]="form" (ngSubmit)="login()" novalidate class="space-y-5">
      <div>
        <label for="login-username" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">Nome de usuário</label>
        <div class="flex h-12 items-center gap-3 rounded-xl border px-4 transition focus-within:ring-2 dark:bg-gray-800/40" [class]="usuarioInvalido ? 'border-red-500 focus-within:ring-red-500/10 dark:border-red-400' : 'border-gray-200 focus-within:border-cyan-500 focus-within:ring-cyan-500/10 dark:border-gray-700 dark:focus-within:border-cyan-400'">
          <svg aria-hidden="true" class="size-4.5 shrink-0 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
          <input id="login-username" name="username" type="text" formControlName="username" placeholder="Seu usuário" autocomplete="username" autocapitalize="none" [spellcheck]="false" [attr.aria-invalid]="usuarioInvalido" [attr.aria-describedby]="usuarioInvalido ? 'username-error' : null" class="min-w-0 w-full bg-transparent text-sm text-gray-900 outline-none placeholder:text-gray-400 dark:text-gray-100 dark:placeholder:text-gray-500" />
        </div>
        @if (usuarioInvalido) {
          <p id="username-error" class="mt-2 text-xs text-red-600 dark:text-red-400">Informe seu nome de usuário.</p>
        }
      </div>

      <div>
        <label for="login-password" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">Senha</label>
        <div class="flex h-12 items-center gap-3 rounded-xl border px-4 transition focus-within:ring-2 dark:bg-gray-800/40" [class]="senhaInvalida ? 'border-red-500 focus-within:ring-red-500/10 dark:border-red-400' : 'border-gray-200 focus-within:border-cyan-500 focus-within:ring-cyan-500/10 dark:border-gray-700 dark:focus-within:border-cyan-400'">
          <svg aria-hidden="true" class="size-4.5 shrink-0 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
          <input id="login-password" name="password" [type]="senhaVisivel ? 'text' : 'password'" formControlName="password" placeholder="Sua senha" autocomplete="current-password" [attr.aria-invalid]="senhaInvalida" [attr.aria-describedby]="senhaInvalida ? 'password-error' : null" class="min-w-0 w-full bg-transparent text-sm text-gray-900 outline-none placeholder:text-gray-400 dark:text-gray-100 dark:placeholder:text-gray-500" />
          <button id="login-password-toggle" name="togglePassword" type="button" (click)="senhaVisivel = !senhaVisivel" [attr.aria-pressed]="senhaVisivel" [attr.aria-label]="senhaVisivel ? 'Ocultar senha' : 'Mostrar senha'" [title]="senhaVisivel ? 'Ocultar senha' : 'Mostrar senha'" aria-controls="login-password" class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded text-gray-400 transition-colors hover:text-cyan-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-500 dark:hover:text-cyan-400">
            <svg class="size-4.5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              @if (senhaVisivel) {
                <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11.6 11.6 0 0 1 12 5c6 0 10 7 10 7a17.7 17.7 0 0 1-3 3.8M6.2 6.2A20.2 20.2 0 0 0 2 12s4 7 10 7a11.5 11.5 0 0 0 5.8-1.8"/>
              } @else {
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
              }
            </svg>
          </button>
        </div>
        @if (senhaInvalida) {
          <p id="password-error" class="mt-2 text-xs text-red-600 dark:text-red-400">Informe sua senha.</p>
        }
      </div>

      <button id="login-submit" name="loginSubmit" type="submit" class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-linear-to-r from-cyan-500 to-[#3C92E7] text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 transition hover:brightness-105 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-500 active:scale-[0.99] motion-reduce:transition-none">
        Entrar
        <svg class="size-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </button>
    </form>

    <div aria-hidden="true" class="my-6 flex items-center gap-4">
      <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
      <span class="text-xs font-medium text-gray-400 dark:text-gray-500">ou</span>
      <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
    </div>

    <div class="flex items-start gap-3 rounded-xl bg-gray-50 p-4 dark:bg-gray-800/60">
      <div aria-hidden="true" class="flex size-10 shrink-0 items-center justify-center rounded-full bg-violet-100 dark:bg-violet-950/40">
        <svg class="size-5 text-violet-500 dark:text-violet-300" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6m5.6 5.6 3.6 3.6m0-12.8-3.6 3.6m-5.6 5.6-3.6 3.6"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-gray-900 dark:text-white">Problemas com o acesso?</p>
        <p class="mt-1 text-xs leading-5 text-gray-600 dark:text-gray-300">Se tiver dificuldade para acessar sua conta, entre em contato.</p>
        <a id="login-contact" routerLink="/contato" class="mt-2 ml-auto flex cursor-pointer items-center gap-1 text-xs font-semibold text-cyan-600 dark:text-cyan-400">
          Entre em contato
          <svg class="size-3.5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</section>
