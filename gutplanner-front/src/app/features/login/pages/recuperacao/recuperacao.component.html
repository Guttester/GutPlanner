<div class="mb-6 text-center"><h1 id="recuperacao-title" class="text-2xl font-bold text-gray-900 dark:text-white">Recuperar acesso</h1><p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Informe seu e-mail para recuperar sua senha.</p></div>
<form id="recuperacao-form" name="recuperacaoForm" [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
<div><label for="recuperacao-email" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">E-mail</label><input id="recuperacao-email" name="email" formControlName="email" type="email" autocomplete="email" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="recuperacao-feedback" class="h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm text-gray-900 outline-cyan-500 dark:border-gray-700 dark:bg-gray-800/40 dark:text-gray-100" /></div>
<div id="recuperacao-feedback">@if (error) { <p role="alert" class="text-xs text-red-600 dark:text-red-400">{{ error }}</p> } @if (message) { <p role="status" class="text-xs leading-5 text-cyan-700 dark:text-cyan-400">{{ message }}</p> }</div><button [disabled]="pending" [attr.aria-busy]="pending" id="recuperacao-submit" name="recuperacaoSubmit" type="submit" class="flex h-12 w-full items-center justify-center rounded-xl bg-linear-to-r from-cyan-500 to-[#3C92E7] text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 hover:brightness-105 focus-visible:outline-2 focus-visible:outline-cyan-500">Solicitar recuperação</button></form><p class="mt-5 text-center text-sm text-gray-500 dark:text-gray-400">Lembrou sua senha? <a id="recuperacao-login" routerLink="/" class="ml-1 rounded font-semibold text-cyan-600 hover:text-cyan-500 dark:text-cyan-400">Voltar para entrar</a></p>
