<div class="mb-6 text-center"><h1 id="reset-title" class="text-2xl font-bold text-gray-900 dark:text-white">Redefinir senha</h1><p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Escolha uma nova senha para sua conta.</p></div>
@if (done) { <p id="reset-success" role="status" class="rounded-xl bg-cyan-50 p-4 text-sm text-cyan-700 dark:bg-cyan-950/40 dark:text-cyan-400">Senha redefinida. Entre com sua nova senha.</p> } @else {
<form id="reset-form" name="resetForm" [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="reset-password">Nova senha<input id="reset-password" name="novaSenha" formControlName="novaSenha" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" maxlength="1024" aria-describedby="reset-feedback" class="mt-2 h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm dark:border-gray-700 dark:text-gray-100 focus:outline-cyan-500" /></label>
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="reset-confirm">Confirmar senha<input id="reset-confirm" name="confirmacao" formControlName="confirmacao" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" maxlength="1024" aria-describedby="reset-feedback" class="mt-2 h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm dark:border-gray-700 dark:text-gray-100 focus:outline-cyan-500" /></label>
<button id="reset-show-password" name="showResetPassword" type="button" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword" class="text-xs font-medium text-cyan-600 dark:text-cyan-400">{{ showPassword ? 'Ocultar senhas' : 'Mostrar senhas' }}</button>
<div id="reset-feedback">@if (error) { <p role="alert" class="text-xs text-red-600 dark:text-red-400">{{ error }}</p> }</div>
<button id="reset-submit" name="resetSubmit" type="submit" [disabled]="pending" [attr.aria-busy]="pending" class="h-12 w-full rounded-xl bg-linear-to-r from-cyan-500 to-[#3C92E7] text-sm font-semibold text-white hover:brightness-105 disabled:opacity-50">{{ pending ? 'Salvando...' : 'Salvar nova senha' }}</button></form>
<p class="mt-4 text-center"><a id="reset-recovery" routerLink="/recuperacao" class="text-sm text-cyan-600 dark:text-cyan-400">Solicitar novo link</a></p> }
<p class="mt-5 text-center"><a id="reset-login" routerLink="/" class="text-sm font-semibold text-cyan-600 dark:text-cyan-400">Voltar para entrar</a></p>
