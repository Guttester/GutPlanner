<div class="mb-6 text-center"><h1 id="cadastro-title" class="text-2xl font-bold text-gray-900 dark:text-white">Crie sua conta</h1><p class="mt-2 text-sm text-gray-600 dark:text-gray-300">Organize seus projetos com o GutPlanner.</p></div>
<form id="cadastro-form" name="cadastroForm" [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
<div><label for="cadastro-name" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">Nome</label><input id="cadastro-name" name="name" formControlName="name" type="text" autocomplete="name" [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid" aria-describedby="cadastro-feedback" class="h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm text-gray-900 outline-cyan-500 dark:border-gray-700 dark:bg-gray-800/40 dark:text-gray-100" /></div>
<div><label for="cadastro-email" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">E-mail</label><input id="cadastro-email" name="email" formControlName="email" type="email" autocomplete="email" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="cadastro-feedback" class="h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm text-gray-900 outline-cyan-500 dark:border-gray-700 dark:bg-gray-800/40 dark:text-gray-100" /></div>
<div><label for="cadastro-password" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">Senha</label><input id="cadastro-password" name="password" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="cadastro-feedback" class="h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm text-gray-900 outline-cyan-500 dark:border-gray-700 dark:bg-gray-800/40 dark:text-gray-100" /></div>
<div><label for="cadastro-confirmation" class="mb-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">Confirmar senha</label><input id="cadastro-confirmation" name="confirmation" formControlName="confirmation" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" [attr.aria-invalid]="form.controls.confirmation.touched && form.controls.confirmation.invalid" aria-describedby="cadastro-feedback" class="h-12 w-full rounded-xl border border-gray-200 bg-transparent px-4 text-sm text-gray-900 outline-cyan-500 dark:border-gray-700 dark:bg-gray-800/40 dark:text-gray-100" /></div>
<div class="flex items-center justify-between gap-2"><p class="text-xs text-gray-500">Pelo menos 8 caracteres.</p><button id="cadastro-password-toggle" name="toggleSignupPassword" type="button" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword" class="rounded text-xs font-semibold text-cyan-600 dark:text-cyan-400">{{ showPassword ? 'Ocultar senhas' : 'Mostrar senhas' }}</button></div><div id="cadastro-feedback">@if (error) { <p role="alert" class="text-xs text-red-600 dark:text-red-400">{{ error }}</p> } @if (message) { <p role="status" class="text-xs leading-5 text-cyan-700 dark:text-cyan-400">{{ message }}</p> }</div><button id="cadastro-submit" name="cadastroSubmit" type="submit" class="flex h-12 w-full items-center justify-center rounded-xl bg-linear-to-r from-cyan-500 to-[#3C92E7] text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 hover:brightness-105 focus-visible:outline-2 focus-visible:outline-cyan-500">Criar conta</button></form><p class="mt-5 text-center text-sm text-gray-500 dark:text-gray-400">Já tem uma conta? <a id="cadastro-login" routerLink="/" class="ml-1 rounded font-semibold text-cyan-600 hover:text-cyan-500 dark:text-cyan-400">Voltar para entrar</a></p>
