name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gutplanner-front
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gutplanner-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producao
        run: npm run build -- --configuration production

      - name: Executar testes Angular
        run: npm test -- --watch=false --browsers=ChromeHeadless

  backend:
    name: Backend - dependencias e sintaxe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gutplanner-back
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar compatibilidade das dependencias
        run: python -m pip check

      # O backend ainda nao possui suite de testes nem aplicacao implementada.
      - name: Validar sintaxe Python
        run: python -m compileall -q main.py src
